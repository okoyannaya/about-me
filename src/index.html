<!doctype html>
<html lang="ru" translate="no">
  <head>
    <meta charset="utf-8" />
    <!-- Apply the SSR theme before the external stylesheet loads. -->
    <script>
      const savedTheme = document.cookie
        .split(';')
        .map((cookie) => cookie.trim())
        .find((cookie) => cookie.startsWith('currentTheme='))
        ?.slice('currentTheme='.length);

      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }

      :root[data-theme='light'] {
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
      }
    </style>
    <title>AboutMe</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-52D93B49"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
    </script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
