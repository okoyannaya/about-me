<nav>
  @for (option of options(); track option.fragment ?? option.path) {
    <a
      [routerLink]="option.path"
      [fragment]="option.fragment"
      [class.active]="option.isActive"
      [attr.aria-current]="option.isActive ? (option.fragment ? 'location' : 'page') : null"
    >
      <span>[</span>
      {{ option.label | uppercase }}
      <span>]</span>
    </a>
  }
</nav>
<div class="controls">
  <app-theme-toggle />
  <app-language-toggle />
</div>
