<div class="theme-switcher" role="group" aria-label="Выбор темы оформления">
  @for (option of options; track option.value) {
    <button
      type="button"
      [class.active]="themeService.themeMode() === option.value"
      (click)="themeService.setTheme(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
